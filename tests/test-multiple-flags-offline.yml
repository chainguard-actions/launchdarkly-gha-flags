name: Test multiple flags offline evaluation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: flags
        uses: .
        with:
          sdk-key: 'sdk-fake-key-for-offline-mode'
          flags: |
            feature-flag-one,true
            feature-flag-two,false
          offline: 'true'
          send-events: 'false'
          context-key: 'test-context'
      - name: Assert first flag output equals default value
        env:
          ACTUAL: ${{ steps.flags.outputs.feature-flag-one }}
        run: |
          echo "actual feature-flag-one: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: feature-flag-one"
      - name: Assert second flag output equals default value
        env:
          ACTUAL: ${{ steps.flags.outputs.feature-flag-two }}
        run: |
          echo "actual feature-flag-two: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: feature-flag-two"
