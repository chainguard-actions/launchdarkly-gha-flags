name: Test offline multiple flags evaluation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: flags
        uses: .
        with:
          sdk-key: 'sdk-fake-key-for-offline-mode'
          flags: |
            feature-enabled,true
            feature-disabled,false
            feature-string,hello
          offline: 'true'
          send-events: 'false'
          context-key: 'test-context'
      - name: Assert feature-enabled flag output
        env:
          ACTUAL: ${{ steps.flags.outputs.feature-enabled }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert feature-disabled flag output
        env:
          ACTUAL: ${{ steps.flags.outputs.feature-disabled }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert feature-string flag output
        env:
          ACTUAL: ${{ steps.flags.outputs.feature-string }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "hello" ]; then
            echo "FAIL: expected 'hello' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
