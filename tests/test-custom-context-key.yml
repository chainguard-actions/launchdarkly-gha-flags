name: Test custom context key in offline mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: flags
        uses: .
        with:
          sdk-key: 'sdk-fake-offline-key'
          offline: 'true'
          send-events: 'false'
          context-key: 'my-custom-context-key'
          flags: |
            rollout-flag,false
      - name: Assert rollout-flag output equals default value false
        env:
          ACTUAL: ${{ steps.flags.outputs.rollout-flag }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
